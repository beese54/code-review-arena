<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1110" width="1240" height="1110" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a83"/>
    </marker>
    <style>
      .t   { fill:#16160f; }
      .m   { fill:#6b6b62; }
      .w   { fill:#ffffff; }
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card{ fill:#ffffff; stroke:#dcdcd3; }
      .ln  { stroke:#a9a9a0; stroke-width:1.6; fill:none; }
    </style>
  </defs>

  <rect width="1240" height="1110" fill="#faf9f5"/>

  <text x="40" y="52" class="t" font-size="27" font-weight="600">Arm A — how a context-aware code review is assembled</text>
  <text x="40" y="78" class="m" font-size="14">Every figure is measured from one real run: markdown-visualiser, 31 files, 4,265 lines of TypeScript.</text>

  <!-- 0 SOURCE -->
  <rect x="420" y="102" width="400" height="46" rx="6" class="card"/>
  <text x="620" y="131" class="t" font-size="14.5" text-anchor="middle">31 source files &#183; 4,265 lines</text>
  <path d="M620,148 L620,178" class="ln" marker-end="url(#a)"/>

  <!-- 1 CHUNK -->
  <rect x="290" y="178" width="660" height="84" rx="6" class="card"/>
  <text x="310" y="202" class="t" font-size="13" font-weight="700" letter-spacing="0.6">1 &#183; CHUNK</text>
  <text x="400" y="202" class="m" font-size="13">split by the TypeScript compiler AST, not by line count</text>
  <text x="310" y="226" class="t" font-size="14.5"><tspan class="num" font-weight="600">199</tspan> chunks &#183; <tspan class="num" font-weight="600">106,988</tspan> chars</text>
  <text x="310" y="248" class="m" font-size="12">function 114 &#183; const 44 &#183; interface 27 &#183; type 9 &#183; class 4 &#183; method 1 — each a whole definition</text>
  <path d="M620,262 L620,292" class="ln" marker-end="url(#a)"/>

  <!-- 2 EMBED -->
  <rect x="290" y="292" width="660" height="84" rx="6" class="card"/>
  <text x="310" y="316" class="t" font-size="13" font-weight="700" letter-spacing="0.6">2 &#183; EMBED</text>
  <text x="400" y="316" class="m" font-size="13">every chunk becomes a position in a shared space</text>
  <text x="310" y="340" class="t" font-size="14.5">all-MiniLM-L6-v2 &#8594; <tspan class="num" font-weight="600">384</tspan> numbers per chunk &#8594; Chroma index</text>
  <text x="310" y="362" class="m" font-size="12">distance is squared L2 over unit vectors, so cos = 1 &#8722; d/2. Nothing here understands code.</text>

  <!-- fan out -->
  <path d="M620,376 L620,400" class="ln"/>
  <path d="M210,400 L1030,400" class="ln"/>
  <path d="M210,400 L210,432" class="ln" marker-end="url(#a)"/>
  <path d="M620,400 L620,432" class="ln" marker-end="url(#a)"/>
  <path d="M1030,400 L1030,432" class="ln" marker-end="url(#a)"/>

  <text x="60" y="394" class="t" font-size="13" font-weight="700" letter-spacing="0.6">3 &#183; RETRIEVE</text>
  <text x="152" y="394" class="m" font-size="13">each specialist asks its own questions, and gets back its own nearest chunks</text>

  <!-- query cards -->
  <g>
    <rect x="60" y="432" width="300" height="104" rx="6" class="card"/>
    <rect x="60" y="432" width="300" height="26" rx="6" fill="#b04a3f"/>
    <rect x="60" y="446" width="300" height="12" fill="#b04a3f"/>
    <text x="74" y="450" class="w" font-size="12.5" font-weight="700" letter-spacing="0.8">SECURITY</text>
    <text x="74" y="480" class="m" font-size="12">10 queries, written in plain English</text>
    <text x="74" y="502" class="t" font-size="11.5" font-style="italic">&#8220;file system path handling, directory</text>
    <text x="74" y="519" class="t" font-size="11.5" font-style="italic">traversal, resolving user supplied paths&#8221;</text>
  </g>
  <g>
    <rect x="470" y="432" width="300" height="104" rx="6" class="card"/>
    <rect x="470" y="432" width="300" height="26" rx="6" fill="#3f6fa8"/>
    <rect x="470" y="446" width="300" height="12" fill="#3f6fa8"/>
    <text x="484" y="450" class="w" font-size="12.5" font-weight="700" letter-spacing="0.8">PATTERN COMPLIANCE</text>
    <text x="484" y="480" class="m" font-size="12">10 queries, written in plain English</text>
    <text x="484" y="502" class="t" font-size="11.5" font-style="italic">&#8220;error handling convention, try catch,</text>
    <text x="484" y="519" class="t" font-size="11.5" font-style="italic">failure propagation, result types&#8221;</text>
  </g>
  <g>
    <rect x="880" y="432" width="300" height="104" rx="6" class="card"/>
    <rect x="880" y="432" width="300" height="26" rx="6" fill="#3f7a5c"/>
    <rect x="880" y="446" width="300" height="12" fill="#3f7a5c"/>
    <text x="894" y="450" class="w" font-size="12.5" font-weight="700" letter-spacing="0.8">REQUIREMENTS GAP</text>
    <text x="894" y="480" class="m" font-size="12">10 queries, written in plain English</text>
    <text x="894" y="502" class="t" font-size="11.5" font-style="italic">&#8220;public API surface, endpoint</text>
    <text x="894" y="519" class="t" font-size="11.5" font-style="italic">handlers, request and response shapes&#8221;</text>
  </g>

  <path d="M210,536 L210,560" class="ln" marker-end="url(#a)"/>
  <path d="M620,536 L620,560" class="ln" marker-end="url(#a)"/>
  <path d="M1030,536 L1030,560" class="ln" marker-end="url(#a)"/>

  <!-- THE GATE -->
  <rect x="60" y="560" width="1120" height="72" rx="6" fill="#fdf5e2" stroke="#c9a44a" stroke-width="1.6"/>
  <text x="80" y="588" class="t" font-size="14.5" font-weight="700">ATTENTION BUDGET &#8212; top-k = 30 per agent</text>
  <text x="80" y="610" class="t" font-size="12.5">A fixed cut <tspan font-weight="600">by rank</tspan>, not a relevance threshold. Exactly 30 chunks are taken whether the 30th is a strong match or the least-bad one left.</text>
  <text x="1160" y="588" class="t" font-size="13" text-anchor="end"><tspan class="num" font-weight="700">15%</tspan> of the index per agent</text>
  <text x="1160" y="610" class="m" font-size="12" text-anchor="end">but <tspan class="num" font-weight="600">39.7%</tspan> combined — the three barely overlap</text>

  <path d="M210,632 L210,656" class="ln" marker-end="url(#a)"/>
  <path d="M620,632 L620,656" class="ln" marker-end="url(#a)"/>
  <path d="M1030,632 L1030,656" class="ln" marker-end="url(#a)"/>

  <!-- bundle cards -->
  <g>
    <rect x="60" y="656" width="300" height="96" rx="6" class="card"/>
    <rect x="60" y="656" width="4" height="96" fill="#b04a3f"/>
    <text x="80" y="682" class="t" font-size="15" font-weight="600"><tspan class="num">30</tspan> of <tspan class="num">199</tspan> chunks</text>
    <text x="80" y="704" class="m" font-size="12"><tspan class="num">20,842</tspan> chars &#8212; <tspan class="num">82.4%</tspan> less</text>
    <text x="80" y="722" class="m" font-size="12">reached <tspan class="num">11</tspan> of 31 files</text>
    <text x="80" y="742" class="m num" font-size="11.5">cos 0.474 &#8594; 0.284</text>
  </g>
  <g>
    <rect x="470" y="656" width="300" height="96" rx="6" class="card"/>
    <rect x="470" y="656" width="4" height="96" fill="#3f6fa8"/>
    <text x="490" y="682" class="t" font-size="15" font-weight="600"><tspan class="num">30</tspan> of <tspan class="num">199</tspan> chunks</text>
    <text x="490" y="704" class="m" font-size="12"><tspan class="num">29,039</tspan> chars &#8212; <tspan class="num">75.4%</tspan> less</text>
    <text x="490" y="722" class="m" font-size="12">reached <tspan class="num">16</tspan> of 31 files</text>
    <text x="490" y="742" class="m num" font-size="11.5">cos 0.385 &#8594; 0.269</text>
  </g>
  <g>
    <rect x="880" y="656" width="300" height="96" rx="6" class="card"/>
    <rect x="880" y="656" width="4" height="96" fill="#3f7a5c"/>
    <text x="900" y="682" class="t" font-size="15" font-weight="600"><tspan class="num">30</tspan> of <tspan class="num">199</tspan> chunks</text>
    <text x="900" y="704" class="m" font-size="12"><tspan class="num">25,430</tspan> chars &#8212; <tspan class="num">78.5%</tspan> less</text>
    <text x="900" y="722" class="m" font-size="12">reached <tspan class="num">12</tspan> of 31 files</text>
    <text x="900" y="742" class="m num" font-size="11.5">cos 0.601 &#8594; 0.386</text>
  </g>

  <!-- side channel -->
  <rect x="60" y="772" width="1120" height="58" rx="6" fill="#eef2ee" stroke="#c2ccc2" stroke-width="1.4"/>
  <text x="80" y="796" class="t" font-size="13" font-weight="700">PASSED WHOLE, NOT RETRIEVED</text>
  <text x="300" y="796" class="t" font-size="12.5">task-context.md (spec + acceptance criteria) &#183; standards.md (CLAUDE.md, eslint, tsconfig, README)</text>
  <text x="80" y="817" class="m" font-size="12">No embedding, no top-k. Every agent gets these in full — and this side channel is the only reason requirements-gap findings are possible at all.</text>

  <path d="M210,830 L210,854" class="ln" marker-end="url(#a)"/>
  <path d="M620,830 L620,854" class="ln" marker-end="url(#a)"/>
  <path d="M1030,830 L1030,854" class="ln" marker-end="url(#a)"/>

  <!-- specialists -->
  <g>
    <rect x="60" y="854" width="300" height="68" rx="6" class="card"/>
    <text x="80" y="878" class="t" font-size="13" font-weight="600">Security agent</text>
    <text x="80" y="898" class="m" font-size="11.5">isolated session &#183; sees only its bundle</text>
    <text x="80" y="915" class="t" font-size="12"><tspan class="num" font-weight="600">6</tspan> raw findings, each citing file:line</text>
  </g>
  <g>
    <rect x="470" y="854" width="300" height="68" rx="6" class="card"/>
    <text x="490" y="878" class="t" font-size="13" font-weight="600">Pattern agent</text>
    <text x="490" y="898" class="m" font-size="11.5">isolated session &#183; sees only its bundle</text>
    <text x="490" y="915" class="t" font-size="12"><tspan class="num" font-weight="600">10</tspan> raw findings, each citing file:line</text>
  </g>
  <g>
    <rect x="880" y="854" width="300" height="68" rx="6" class="card"/>
    <text x="900" y="878" class="t" font-size="13" font-weight="600">Requirements agent</text>
    <text x="900" y="898" class="m" font-size="11.5">isolated session &#183; sees only its bundle</text>
    <text x="900" y="915" class="t" font-size="12"><tspan class="num" font-weight="600">5</tspan> raw findings, each citing file:line</text>
  </g>

  <path d="M210,922 L210,940 L620,940" class="ln"/>
  <path d="M1030,922 L1030,940 L620,940" class="ln"/>
  <path d="M620,922 L620,964" class="ln" marker-end="url(#a)"/>

  <!-- ensemble -->
  <rect x="290" y="964" width="660" height="64" rx="6" class="card"/>
  <text x="310" y="988" class="t" font-size="13" font-weight="700" letter-spacing="0.6">4 &#183; COMBINE</text>
  <text x="405" y="988" class="t" font-size="13"><tspan class="num" font-weight="600">21</tspan> raw &#8594; <tspan class="num" font-weight="600">20</tspan> after dedup &#8594; <tspan class="num" font-weight="600">6</tspan> Action Required, <tspan class="num" font-weight="600">14</tspan> Review Recommended</text>
  <text x="310" y="1010" class="m" font-size="11.5">Exactly 1 finding was reached by two specialists independently — and that was the finding verification deflated hardest.</text>

  <!-- cost band -->
  <rect x="60" y="1046" width="1120" height="44" rx="6" fill="#f7eeec" stroke="#d2b0a9" stroke-width="1.4"/>
  <text x="80" y="1067" class="t" font-size="13" font-weight="700">WHAT THE BUDGET COSTS</text>
  <text x="250" y="1067" class="t" font-size="12"><tspan class="num" font-weight="600">7</tspan> of 31 files never retrieved by any agent — the entire UI layer &#183; <tspan class="num" font-weight="600">24</tspan> of 53 acceptance criteria not assessable</text>
  <text x="80" y="1084" class="m" font-size="12">And one thing no budget fixes: &#8220;nothing imports this&#8221; is not a chunk. An absence has no position in the space, so it can never be retrieved.</text>
</svg>
